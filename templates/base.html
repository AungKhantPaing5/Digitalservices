<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0b10"><title>DigitalServices — Premium VPN</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="nav"><a href="/" class="brand"><span class="logo">◈</span> Digital<span>Services</span></a><nav><a href="/#plans">Plans</a>{% if me %}<a href="{{url_for('admin') if me.admin else url_for('dashboard')}}">{{'Admin' if me.admin else 'My VPN'}}</a><form class="inline" action="/logout" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><button class="quiet">Logout</button></form>{% else %}<a href="/login">Sign in</a><a class="navbtn" href="/register">Get Started ↗</a>{% endif %}</nav></header><main>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% block body %}{% endblock %}</main><footer><span class="brand">◈ DigitalServices</span><span>Private access. Simple control. © 2026</span></footer><script>function copyKey(id,btn){navigator.clipboard.writeText(document.getElementById(id).value).then(()=>btn.textContent='✓ Copied!').catch(()=>alert('Copy manually using the text box'));}</script></body></html>
